services:
  - type: web
    name: trade-lead-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_BASE_URL
        value: https://api.deepseek.com

databases:
  - name: trade-lead-db
    plan: free
